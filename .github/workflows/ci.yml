name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Instalar Chromium e dependências do sistema
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Instalar Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Testes unitários e e2e com cobertura mínima de 80%
        run: pytest tests --cov=followback --cov-report=term-missing --cov-fail-under=80
